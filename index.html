.item{background:#0d111c;border-radius:12px;overflow:hidden;border:1px solid #1e2a4a;position:relative}

.hidden{display:none}
.tabs{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}.tabs button{flex:1;padding:8px;font-size:10px;background:#1e2a4a;color:#fff}.tabs button.active{background:linear-gradient(90deg,#00f2ff,#7000ff);color:#fff}
.admin-bg{background:#1a1030!important;border:2px solid #ff00ff!important}.seller-bg{border:2px solid #00f2ff!important}
.preview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.preview-box{width:100%;aspect-ratio:1;background:#0d111c;border-radius:8px;overflow:hidden;border:1px dashed #1e2a4a;position:relative;display:flex;align-items:center;justify-content:center;font-size:20px}
.preview-box img{width:100%;height:100%;object-fit:cover}.preview-box .remove{position:absolute;top:2px;right:2px;background:#ff2a6d;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.video-preview{width:100%;height:120px;background:#000;border-radius:10px;overflow:hidden;margin:8px 0;position:relative;display:flex;align-items:center;justify-content:center}
.upload-label{display:block;background:#1e2a4a;padding:10px;border-radius:10px;text-align:center;font-family:Orbitron;font-size:11px;margin:5px 0;cursor:pointer;border:1px dashed #00f2ff}
.upload-label span{color:#00f2ff}
.gallery-dots{display:flex;gap:4px;justify-content:center;margin:5px 0}
