<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tshepisong Test</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:15px}
.card{background:#222;padding:15px;border-radius:12px;margin:10px 0}
button{background:#25D366;color:#000;padding:15px;border:0;border-radius:10px;font-weight:bold;width:100%;font-size:18px;margin:8px 0}
input{padding:14px;width:100%;border-radius:10px;border:0;margin:6px 0;background:#333;color:#fff;font-size:16px}
</style>
</head>
<body>
<h2>🏠 Tshepisong Market - TEST MODE</h2>
<div id="status" class="card" style="background:green;color:#fff">✅ Page Loaded - JavaScript Working!</div>

<div class="card">
<h3>📱 Register Seller</h3>
<input id="phone" placeholder="WhatsApp 0761234567" value="0761234567">
<input id="pin" placeholder="PIN" value="1234">
<input id="name" placeholder="Full Name" value="Tshepo">
<input id="surname" placeholder="Surname" value="Molefe">
<button onclick="testRegister()">✅ CLICK TO REGISTER - TEST</button>
<button onclick="alert('Button works! JS is working!')" style="background:#ffcc00">🟡 TEST BUTTON - Click me</button>
</div>

<div id="result" class="card">Result will show here</div>

<script>
function testRegister(){
  try{
    document.getElementById('status').innerHTML = '🔄 Register clicked!';
    document.getElementById('status').style.background = '#ffcc00';
    document.getElementById('status').style.color = '#000';
    
    const phone = document.getElementById('phone').value;
    const pin = document.getElementById('pin').value;
    const name = document.getElementById('name').value;
    const surname = document.getElementById('surname').value;
    
    if(!phone){ alert('Enter phone'); return; }
    
    // Save to localStorage
    const user = { phone, pin, name, surname, fullName: name+' '+surname };
    localStorage.setItem('tshepi_test', JSON.stringify(user));
    
    document.getElementById('result').innerHTML = `
      <h3>✅ REGISTERED!</h3>
      <p><b>Phone:</b> ${phone}</p>
      <p><b>PIN:</b> ${pin}</p>
      <p><b>Name:</b> ${name} ${surname}</p>
      <p>Saved in phone!</p>
    `;
    document.getElementById('status').innerHTML = '✅ SUCCESS! Registered '+name+' '+surname;
    document.getElementById('status').style.background = 'green';
    document.getElementById('status').style.color = '#fff';
    
    alert('✅ Registered!\n'+name+' '+surname+'\nPhone: '+phone+'\n\nNow login works!');
  }catch(e){
    document.getElementById('status').innerHTML = '❌ Error: '+e.message;
    document.getElementById('status').style.background = 'red';
    alert('Error: '+e.message);
  }
}

// Auto test on load
window.onload = function(){
  document.getElementById('status').innerHTML = '✅ JavaScript Loaded! Click TEST button!';
}
</script>
</body>
</html>
